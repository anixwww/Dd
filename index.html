    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function() {
        function isResizeObserverError(err) {
          if (!err) return false;
          var msg = typeof err === 'string' ? err : (err.message || '');
          return msg.indexOf('ResizeObserver loop completed with undelivered notifications') !== -1 ||
                 msg.indexOf('ResizeObserver loop limit exceeded') !== -1;
        }

        window.addEventListener('error', function(e) {
          if (isResizeObserverError(e.message) || isResizeObserverError(e.error)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isResizeObserverError(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        var origConsoleError = console.error;
        console.error = function() {
          if (arguments.length > 0 && isResizeObserverError(arguments[0])) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };
      })();
    </script>
